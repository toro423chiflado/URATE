# ================================================================
# URATE — nginx.conf (balanceador de carga interno)
# ================================================================
events {
    worker_connections 1024;
}

http {
    upstream ms_users {
        server ms-users:3001;
    }
    upstream ms_academic {
        server ms-academic:3002;
    }
    upstream ms_reviews {
        server ms-reviews:3003;
    }
    upstream ms_content {
        server ms-content:3004;
    }
    upstream ms_analytics {
        server ms-analytics:3005;
    }

    # Headers comunes
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    server {
        listen 80;

        # MS1 — Users
        location /api/v1/auth/ {
            proxy_pass http://ms_users/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/v1/usuarios/ {
            proxy_pass http://ms_users/usuarios/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/v1/admin/ {
            proxy_pass http://ms_users/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # MS2 — Academic
        location /api/v1/carreras/ {
            proxy_pass http://ms_academic/carreras/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/v1/cursos/ {
            proxy_pass http://ms_academic/cursos/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/v1/profesor-curso/ {
            proxy_pass http://ms_academic/profesor-curso/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # MS3 — Reviews
        location /api/v1/calificaciones/ {
            proxy_pass http://ms_reviews/calificaciones/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/v1/repositorios/ {
            proxy_pass http://ms_reviews/repositorios/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # MS4 — Content (orquestador)
        location /api/v1/content/ {
            proxy_pass http://ms_content/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # MS5 — Analytics
        location /api/v1/analytics/ {
            proxy_pass http://ms_analytics/analytics/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/v1/ingest/ {
            proxy_pass http://ms_analytics/ingest/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Health global
        location /health {
            return 200 '{"status":"ok","service":"nginx-lb"}';
            add_header Content-Type application/json;
        }
    }
}
